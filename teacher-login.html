<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | تسجيل دخول المدرس</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            min-height: 560px;
            border-radius: 28px;
            overflow: hidden;
            position: relative;

            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.32),
                    rgba(15, 23, 42, 0.32)
                ),
                url('https://i.ibb.co/HfRP5zx8/Whats-App-Image-2026-09-03-at-3-34-26-AM.jpg');

            background-size: cover;
            background-position: center;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(15, 23, 42, 0.15),
                rgba(15, 23, 42, 0.75)
            );
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 35px 28px;
            text-align: center;
        }

        .brand {
            color: white;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.92);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .login-title {
            color: white;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-label {
            display: block;
            color: white;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 19px;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 54px;
            border: none;
            outline: none;
            border-radius: 15px;
            padding: 0 48px 0 15px;
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            font-size: 16px;
            font-weight: 600;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .login-button {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 16px;
            margin-top: 10px;

            background: white;
            color: #0f172a;

            font-size: 17px;
            font-weight: 900;

            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            min-height: 25px;
            margin-top: 18px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.6;
        }

        .footer {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .login-card {
                min-height: 550px;
                border-radius: 24px;
            }

            .content {
                padding: 30px 22px;
            }

            .brand {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="overlay"></div>

        <div class="content">

            <div class="brand">NEXORA</div>

            <div class="subtitle">
                لوحة تحكم المدرس
            </div>

            <div class="login-title">
                🔐 تسجيل دخول المدرس
            </div>

            <form id="loginForm">

                <div class="input-group">

                    <label class="input-label">
                        اسم المستخدم
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="أدخل اسم المستخدم"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label class="input-label">
                        كلمة المرور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>

                <div
                    class="message"
                    id="message"
                ></div>

            </form>


            <div class="footer">
                NEXORA | Shihab Innovation
            </div>

        </div>

    </div>


    <script>

        const supabaseClient = window.supabase.createClient(
            'https://bbiflvdwardvozjvrsya.supabase.co',
            'sb_publishable_I_7nb9Ab0--dz_5hpzq27w_G8_7b6PL'
        );


        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('loginButton');
        const message = document.getElementById('message');


        function showMessage(text, type = 'error') {

            message.textContent = text;

            if (type === 'success') {
                message.style.color = '#bbf7d0';
            } else {
                message.style.color = '#fecaca';
            }

        }


        loginForm.addEventListener('submit', async function (event) {

            event.preventDefault();


            const username = usernameInput.value.trim();
            const password = passwordInput.value;


            if (!username || !password) {

                showMessage(
                    'من فضلك أدخل اسم المستخدم وكلمة المرور.'
                );

                return;
            }


            loginButton.disabled = true;
            loginButton.textContent = 'جاري تسجيل الدخول...';

            message.textContent = '';


            try {

                const { data, error } = await supabaseClient.rpc(
                    'create_teacher_session',
                    {
                        p_username: username,
                        p_password: password
                    }
                );


                if (error) {

                    console.error(
                        'Login RPC Error:',
                        error
                    );

                    showMessage(
                        'حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.'
                    );

                    loginButton.disabled = false;
                    loginButton.textContent = 'تسجيل الدخول';

                    return;
                }


                if (!data || data.length === 0) {

                    showMessage(
                        'اسم المستخدم أو كلمة المرور غير صحيحة.'
                    );

                    loginButton.disabled = false;
                    loginButton.textContent = 'تسجيل الدخول';

                    return;
                }


                const teacher = data[0];


                /*
                 * حفظ بيانات المدرس العامة
                 * بدون حفظ كلمة المرور
                 */

                localStorage.setItem(
                    'nexora_teacher_session',
                    JSON.stringify({
                        teacher_id: teacher.teacher_id,
                        username: teacher.username,
                        name: teacher.name,
                        image: teacher.image,
                        expires_at: teacher.expires_at,
                        login_at: new Date().toISOString()
                    })
                );


                /*
                 * حفظ التوكن في sessionStorage
                 *
                 * مهم:
                 * لا يتم فتح لوحة التحكم في تاب جديد.
                 * سيتم الانتقال إليها من نفس التاب.
                 */

                sessionStorage.setItem(
                    'nexora_teacher_token',
                    teacher.session_token
                );


                showMessage(
                    'تم تسجيل الدخول بنجاح ✅ أهلاً بك ' + teacher.name,
                    'success'
                );


                loginButton.textContent =
                    'تم تسجيل الدخول ✅';


                /*
                 * الانتقال التلقائي إلى لوحة التحكم
                 * في نفس التاب للحفاظ على sessionStorage
                 */

                setTimeout(function () {

                    window.location.href =
                        'teacher-dashboard.html';

                }, 800);


            } catch (error) {

                console.error(
                    'Unexpected Login Error:',
                    error
                );

                showMessage(
                    'حدث خطأ غير متوقع. حاول مرة أخرى.'
                );

                loginButton.disabled = false;
                loginButton.textContent = 'تسجيل الدخول';

            }

        });

    </script>

</body>
</html>
