<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | ملف الطالب</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .teacher-image {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        .teacher-name {
            font-size: 20px;
            font-weight: 900;
        }

        .brand {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        .back-button {
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;

            padding: 11px 17px;
            border-radius: 12px;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;

            padding: 30px 20px 50px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
            font-size: 15px;
        }

        .profile-card {
            background: white;
            border-radius: 22px;
            overflow: hidden;

            box-shadow:
                0 5px 25px rgba(15, 23, 42, 0.07);
        }

        .profile-header {
            background: #0f172a;
            color: white;

            padding: 30px 25px;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .student-avatar {
            width: 80px;
            height: 80px;

            border-radius: 50%;

            background: #f1f5f9;
            color: #0f172a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            flex-shrink: 0;
        }

        .student-header-name {
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .student-header-id {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;

            direction: ltr;
            text-align: right;
        }

        .details {
            padding: 25px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 18px;
        }

        .detail-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;

            padding: 18px;

            background: #f8fafc;
        }

        .detail-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 17px;
            font-weight: 900;

            word-break: break-word;
        }

        .phone {
            direction: ltr;
            text-align: right;
        }

        .student-id {
            direction: ltr;
            text-align: right;

            font-family: monospace;
        }

        .status {
            display: inline-block;

            background: #dcfce7;
            color: #166534;

            padding: 7px 12px;
            border-radius: 20px;

            font-size: 13px;
            font-weight: 900;
        }

        /* =========================
           الأقسام
        ========================= */

        .sections {
            padding: 0 25px 25px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 15px;
        }

        .section-card {
            border: 1px solid #e2e8f0;
            border-radius: 17px;

            padding: 20px;

            background: white;

            text-align: center;

            cursor: pointer;
            transition: 0.2s;
        }

        .section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .section-card.active {
            border-color: #0f172a;
            background: #f8fafc;
        }

        .section-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .section-text {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        /* =========================
           محتوى النتائج
        ========================= */

        .results-container {
            display: none;
            padding: 0 25px 25px;
        }

        .results-container.show {
            display: block;
        }

        .results-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .results-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 16px;
            text-align: center;
        }

        .summary-label {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .summary-value {
            font-size: 21px;
            font-weight: 900;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            background: #f8fafc;
        }

        .result-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 14px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.6;
        }

        .result-percentage {
            font-size: 20px;
            font-weight: 900;
            white-space: nowrap;
        }

        .result-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .result-info-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px;
        }

        .result-info-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .result-info-value {
            font-size: 14px;
            font-weight: 900;
        }

        .empty-results {
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
            font-size: 14px;
            font-weight: 800;
        }

        .results-loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-weight: 800;
        }

        /* =========================
           محتوى الأنشطة
        ========================= */

        .activities-container {
            display: none;
            padding: 0 25px 25px;
        }

        .activities-container.show {
            display: block;
        }

        .activities-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .activities-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .activity-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            background: #f8fafc;
        }

        .activity-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
        }

        .activity-type {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.6;
        }

        .activity-date {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .activity-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .activity-info-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px;
        }

        .activity-info-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .activity-info-value {
            font-size: 14px;
            font-weight: 900;
            line-height: 1.6;
            word-break: break-word;
        }

        .activity-details {
            margin-top: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
        }

        .activity-details-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .activity-details-value {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .activities-loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-weight: 800;
        }

        .empty-activities {
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
            font-size: 14px;
            font-weight: 800;
        }

        .footer {
            text-align: center;

            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;

            padding: 30px 0 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            font-weight: 800;
            color: #64748b;
        }

        .error {
            text-align: center;
            padding: 50px 20px;
        }

        .error-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .error-text {
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .header {
                padding: 15px;
            }

            .teacher-name {
                font-size: 17px;
            }

            .teacher-image {
                width: 48px;
                height: 48px;
            }

            .container {
                padding: 22px 12px 40px;
            }

            .page-title h1 {
                font-size: 23px;
            }

            .profile-header {
                padding: 25px 20px;
            }

            .student-avatar {
                width: 65px;
                height: 65px;
                font-size: 30px;
            }

            .student-header-name {
                font-size: 22px;
            }

            .details {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .sections {
                grid-template-columns: 1fr;
                padding: 0 20px 20px;
            }

            .results-container {
                padding: 0 20px 20px;
            }

            .activities-container {
                padding: 0 20px 20px;
            }

            .results-summary {
                grid-template-columns: 1fr;
            }

            .result-info {
                grid-template-columns: 1fr;
            }

            .activity-info {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 450px) {

            .header {
                align-items: flex-start;
            }

            .back-button {
                padding: 9px 12px;
                font-size: 13px;
            }

            .profile-header {
                gap: 14px;
            }

            .student-header-id {
                font-size: 12px;
            }

            .result-top {
                flex-direction: column;
            }

            .activity-top {
                flex-direction: column;
            }

        }

    </style>
</head>


<body>


    <header class="header">

        <div class="teacher-info">

            <img
                class="teacher-image"
                src="https://i.ibb.co/HfRP5zx8/Whats-App-Image-2026-09-03-at-3-34-26-AM.jpg"
                alt="المدرس"
            >

            <div>

                <div class="teacher-name">
                    مستر مهاب
                </div>

                <div class="brand">
                    NEXORA | Shihab Innovation
                </div>

            </div>

        </div>


        <button
            class="back-button"
            onclick="goBack()"
        >
            ← العودة للطلاب
        </button>

    </header>


    <main class="container">


        <section class="page-title">

            <h1>
                👨‍🎓 ملف الطالب
            </h1>

            <p>
                بيانات الطالب الأساسية
            </p>

        </section>


        <section class="profile-card" id="profileCard">

            <div class="loading">
                ⏳ جاري تحميل بيانات الطالب...
            </div>

        </section>


        <div class="footer">
            NEXORA | Shihab Innovation
        </div>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const supabaseClient = window.supabase.createClient(
            'https://bbiflvdwardvozjvrsya.supabase.co',
            'sb_publishable_I_7nb9Ab0--dz_5hpzq27w_G8_7b6PL'
        );


        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function formatDate(value) {

            if (!value) {
                return 'غير متوفر';
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString('ar-EG', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric'
            });

        }


        function formatDateTime(value) {

            if (!value) {
                return 'غير متوفر';
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString('ar-EG', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });

        }


        function showError(title, text) {

            document.getElementById('profileCard').innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <div class="error-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="error-text">
                        ${escapeHtml(text)}
                    </div>

                </div>

            `;

        }


        function formatActivityType(type) {

            if (!type) {
                return 'نشاط داخل المنصة';
            }

            const activityMap = {

                'page_view': '👁️ مشاهدة صفحة',

                'view_page': '👁️ مشاهدة صفحة',

                'login': '🔐 تسجيل دخول',

                'logout': '🚪 تسجيل خروج',

                'exam_start': '📝 بدء اختبار',

                'exam_complete': '✅ إكمال اختبار',

                'lesson_start': '📖 بدء درس',

                'lesson_complete': '🎯 إكمال درس',

                'certificate_view': '🏆 مشاهدة شهادة',

                'result_view': '📊 مشاهدة نتيجة',

                'registration': '👤 تسجيل الطالب'

            };

            return activityMap[type] || type;

        }


        function formatActivityDetails(details) {

            if (
                details === null ||
                details === undefined ||
                details === ''
            ) {
                return '';
            }

            if (typeof details === 'object') {

                try {

                    return JSON.stringify(
                        details,
                        null,
                        2
                    );

                } catch (error) {

                    return String(details);

                }

            }

            return String(details);

        }


        function renderResults(results) {

            if (!results || results.length === 0) {

                return `

                    <div class="empty-results">
                        لا توجد نتائج اختبارات مسجلة لهذا الطالب حتى الآن.
                    </div>

                `;

            }


            const totalResults = results.length;


            const averagePercentage =
                Math.round(
                    results.reduce(
                        function (sum, result) {
                            return sum + Number(result.percentage || 0);
                        },
                        0
                    ) / totalResults
                );


            const highestPercentage =
                Math.max.apply(
                    null,
                    results.map(function (result) {
                        return Number(result.percentage || 0);
                    })
                );


            const resultCards = results.map(function (result) {

                return `

                    <div class="result-card">

                        <div class="result-top">

                            <div class="result-title">
                                ${escapeHtml(result.title)}
                            </div>

                            <div class="result-percentage">
                                ${escapeHtml(result.percentage)}%
                            </div>

                        </div>


                        <div class="result-info">


                            <div class="result-info-item">

                                <div class="result-info-label">
                                    الدرجة
                                </div>

                                <div class="result-info-value">
                                    ${escapeHtml(result.correct)}
                                    /
                                    ${escapeHtml(result.total)}
                                </div>

                            </div>


                            <div class="result-info-item">

                                <div class="result-info-label">
                                    الصف
                                </div>

                                <div class="result-info-value">
                                    ${
                                        result.grade !== null &&
                                        result.grade !== undefined
                                            ? escapeHtml(result.grade)
                                            : 'غير محدد'
                                    }
                                </div>

                            </div>


                            <div class="result-info-item">

                                <div class="result-info-label">
                                    التاريخ
                                </div>

                                <div class="result-info-value">
                                    ${formatDate(result.completed_at)}
                                </div>

                            </div>


                        </div>

                    </div>

                `;

            }).join('');


            return `

                <div class="results-title">
                    📊 نتائج الطالب
                </div>


                <div class="results-summary">


                    <div class="summary-card">

                        <div class="summary-label">
                            إجمالي الاختبارات
                        </div>

                        <div class="summary-value">
                            ${totalResults}
                        </div>

                    </div>


                    <div class="summary-card">

                        <div class="summary-label">
                            متوسط النتائج
                        </div>

                        <div class="summary-value">
                            ${averagePercentage}%
                        </div>

                    </div>


                    <div class="summary-card">

                        <div class="summary-label">
                            أعلى نتيجة
                        </div>

                        <div class="summary-value">
                            ${highestPercentage}%
                        </div>

                    </div>


                </div>


                <div class="results-list">

                    ${resultCards}

                </div>

            `;

        }


        async function loadStudentResults(
            sessionToken,
            studentId
        ) {

            const resultsContainer =
                document.getElementById('resultsContainer');


            resultsContainer.innerHTML = `

                <div class="results-title">
                    📊 نتائج الطالب
                </div>

                <div class="results-loading">
                    ⏳ جاري تحميل النتائج...
                </div>

            `;


            const { data, error } =
                await supabaseClient.rpc(
                    'get_teacher_student_results_by_session',
                    {
                        p_session_token: sessionToken,
                        p_student_id: studentId
                    }
                );


            if (error) {

                console.error(
                    'Results RPC error:',
                    error
                );

                resultsContainer.innerHTML = `

                    <div class="results-title">
                        📊 نتائج الطالب
                    </div>

                    <div class="empty-results">
                        تعذر تحميل نتائج الطالب حاليًا.
                    </div>

                `;

                return;

            }


            resultsContainer.innerHTML =
                renderResults(data);

        }


        function toggleResults() {

            const resultsContainer =
                document.getElementById('resultsContainer');

            const resultsButton =
                document.getElementById('resultsButton');


            if (
                resultsContainer.classList.contains('show')
            ) {

                resultsContainer.classList.remove('show');

                resultsButton.classList.remove('active');

                return;

            }


            resultsContainer.classList.add('show');

            resultsButton.classList.add('active');

        }


        function renderActivities(activities) {

            if (!activities || activities.length === 0) {

                return `

                    <div class="empty-activities">
                        لا توجد أنشطة مسجلة لهذا الطالب حتى الآن.
                    </div>

                `;

            }


            const activityCards = activities.map(function (activity) {

                const details =
                    formatActivityDetails(activity.details);


                return `

                    <div class="activity-card">

                        <div class="activity-top">

                            <div class="activity-type">
                                ${escapeHtml(
                                    formatActivityType(
                                        activity.activity_type
                                    )
                                )}
                            </div>

                            <div class="activity-date">
                                ${formatDateTime(activity.created_at)}
                            </div>

                        </div>


                        <div class="activity-info">


                            <div class="activity-info-item">

                                <div class="activity-info-label">
                                    الصفحة
                                </div>

                                <div class="activity-info-value">
                                    ${
                                        activity.page
                                            ? escapeHtml(activity.page)
                                            : 'غير محددة'
                                    }
                                </div>

                            </div>


                            <div class="activity-info-item">

                                <div class="activity-info-label">
                                    نوع النشاط
                                </div>

                                <div class="activity-info-value">
                                    ${escapeHtml(
                                        activity.activity_type ||
                                        'غير محدد'
                                    )}
                                </div>

                            </div>


                        </div>


                        ${
                            details
                                ? `
                                    <div class="activity-details">

                                        <div class="activity-details-label">
                                            التفاصيل
                                        </div>

                                        <div class="activity-details-value">
                                            ${escapeHtml(details)}
                                        </div>

                                    </div>
                                `
                                : ''
                        }

                    </div>

                `;

            }).join('');


            return `

                <div class="activities-title">
                    📚 نشاط الطالب
                </div>


                <div class="activities-list">

                    ${activityCards}

                </div>

            `;

        }


        async function loadStudentActivities(
            sessionToken,
            studentId
        ) {

            const activitiesContainer =
                document.getElementById('activitiesContainer');


            activitiesContainer.innerHTML = `

                <div class="activities-title">
                    📚 نشاط الطالب
                </div>

                <div class="activities-loading">
                    ⏳ جاري تحميل الأنشطة...
                </div>

            `;


            const { data, error } =
                await supabaseClient.rpc(
                    'get_teacher_student_activities_by_session',
                    {
                        p_session_token: sessionToken,
                        p_student_id: studentId
                    }
                );


            if (error) {

                console.error(
                    'Activities RPC error:',
                    error
                );

                activitiesContainer.innerHTML = `

                    <div class="activities-title">
                        📚 نشاط الطالب
                    </div>

                    <div class="empty-activities">
                        تعذر تحميل أنشطة الطالب حاليًا.
                    </div>

                `;

                return;

            }


            activitiesContainer.innerHTML =
                renderActivities(data);

        }


        function toggleActivities() {

            const activitiesContainer =
                document.getElementById('activitiesContainer');

            const activitiesButton =
                document.getElementById('activitiesButton');


            if (
                activitiesContainer.classList.contains('show')
            ) {

                activitiesContainer.classList.remove('show');

                activitiesButton.classList.remove('active');

                return;

            }


            activitiesContainer.classList.add('show');

            activitiesButton.classList.add('active');

        }


        async function loadStudent() {

            try {

                const params = new URLSearchParams(
                    window.location.search
                );

                const studentId = params.get('student_id');


                if (!studentId) {

                    showError(
                        'لم يتم تحديد الطالب',
                        'الرابط لا يحتوي على رقم الطالب.'
                    );

                    return;
                }


                const sessionData = localStorage.getItem(
                    'nexora_teacher_session'
                );

                const sessionToken = sessionStorage.getItem(
                    'nexora_teacher_token'
                );


                if (!sessionData || !sessionToken) {

                    window.location.href =
                        'teacher-login.html';

                    return;
                }


                let teacherSession;

                try {

                    teacherSession =
                        JSON.parse(sessionData);

                } catch (error) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;
                }


                if (
                    !teacherSession.expires_at ||
                    new Date(teacherSession.expires_at) <= new Date()
                ) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;
                }


                const { data, error } =
                    await supabaseClient.rpc(
                        'get_teacher_student_by_session',
                        {
                            p_session_token: sessionToken,
                            p_student_id: studentId
                        }
                    );


                if (error) {

                    console.error(
                        'Student RPC error:',
                        error
                    );

                    showError(
                        'حدث خطأ',
                        'تعذر تحميل بيانات الطالب.'
                    );

                    return;
                }


                if (!data || data.length === 0) {

                    showError(
                        'الطالب غير موجود',
                        'لم يتم العثور على هذا الطالب أو انتهت جلسة تسجيل الدخول.'
                    );

                    return;
                }


                const student = data[0];


                document.getElementById(
                    'profileCard'
                ).innerHTML = `

                    <div class="profile-header">

                        <div class="student-avatar">
                            👨‍🎓
                        </div>


                        <div>

                            <div class="student-header-name">
                                ${escapeHtml(student.name)}
                            </div>


                            <div class="student-header-id">
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>

                    </div>


                    <div class="details">


                        <div class="detail-card">

                            <div class="detail-label">
                                👤 اسم الطالب
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(student.name)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                🆔 رقم الطالب
                            </div>

                            <div class="detail-value student-id">
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                📱 رقم الهاتف
                            </div>

                            <div class="detail-value phone">
                                ${escapeHtml(student.phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                👨‍👩‍👦 رقم ولي الأمر
                            </div>

                            <div class="detail-value phone">
                                ${escapeHtml(student.parent_phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                📅 تاريخ التسجيل
                            </div>

                            <div class="detail-value">
                                ${formatDate(student.created_at)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                🟢 حالة الطالب
                            </div>

                            <div class="detail-value">

                                <span class="status">
                                    نشط
                                </span>

                            </div>

                        </div>


                    </div>


                    <div class="sections">


                        <div
                            class="section-card"
                            id="resultsButton"
                            onclick="toggleResults()"
                        >

                            <div class="section-icon">
                                📊
                            </div>

                            <div class="section-title">
                                النتائج
                            </div>

                            <div class="section-text">
                                اضغط لعرض نتائج الاختبارات والتقييمات
                            </div>

                        </div>


                        <div
                            class="section-card"
                            id="activitiesButton"
                            onclick="toggleActivities()"
                        >

                            <div class="section-icon">
                                📚
                            </div>

                            <div class="section-title">
                                الأنشطة
                            </div>

                            <div class="section-text">
                                متابعة نشاط الطالب داخل المنصة
                            </div>

                        </div>


                        <div
                            class="section-card"
                            onclick="alert('قسم الشهادات سيتم تفعيله لاحقًا 🏆')"
                        >

                            <div class="section-icon">
                                🏆
                            </div>

                            <div class="section-title">
                                الشهادات
                            </div>

                            <div class="section-text">
                                شهادات الإنجاز والتفوق
                            </div>

                        </div>


                    </div>


                    <div
                        class="results-container"
                        id="resultsContainer"
                    >
                    </div>


                    <div
                        class="activities-container"
                        id="activitiesContainer"
                    >
                    </div>

                `;


                /*
                 * نجهز النتائج والأنشطة من البداية،
                 * لكنهما يظلان مخفيين حتى الضغط على القسم.
                 */

                await loadStudentResults(
                    sessionToken,
                    student.student_id
                );


                await loadStudentActivities(
                    sessionToken,
                    student.student_id
                );


            } catch (error) {

                console.error(
                    'Unexpected error:',
                    error
                );

                showError(
                    'حدث خطأ غير متوقع',
                    'تعذر تحميل ملف الطالب.'
                );

            }

        }


        function goBack() {

            window.location.href =
                'teacher-dashboard.html';

        }


        loadStudent();

    </script>


</body>

</html>
