<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | ملف الطالب</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .teacher-image {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        .teacher-name {
            font-size: 20px;
            font-weight: 900;
        }

        .brand {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        .back-button {
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;

            padding: 11px 17px;
            border-radius: 12px;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;

            padding: 30px 20px 50px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
            font-size: 15px;
        }

        .profile-card {
            background: white;
            border-radius: 22px;
            overflow: hidden;

            box-shadow:
                0 5px 25px rgba(15, 23, 42, 0.07);
        }

        .profile-header {
            background: #0f172a;
            color: white;

            padding: 30px 25px;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .student-avatar {
            width: 80px;
            height: 80px;

            border-radius: 50%;

            background: #f1f5f9;
            color: #0f172a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            flex-shrink: 0;
        }

        .student-header-name {
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .student-header-id {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;

            direction: ltr;
            text-align: right;
        }

        .details {
            padding: 25px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 18px;
        }

        .detail-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;

            padding: 18px;

            background: #f8fafc;
        }

        .detail-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 17px;
            font-weight: 900;

            word-break: break-word;
        }

        .phone {
            direction: ltr;
            text-align: right;
        }

        .student-id {
            direction: ltr;
            text-align: right;

            font-family: monospace;
        }

        .status {
            display: inline-block;

            background: #dcfce7;
            color: #166534;

            padding: 7px 12px;
            border-radius: 20px;

            font-size: 13px;
            font-weight: 900;
        }

        .sections {
            padding: 0 25px 25px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 15px;
        }

        .section-card {
            border: 1px solid #e2e8f0;
            border-radius: 17px;

            padding: 20px;

            background: white;

            text-align: center;
        }

        .section-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .section-text {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        .footer {
            text-align: center;

            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;

            padding: 30px 0 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            font-weight: 800;
            color: #64748b;
        }

        .error {
            text-align: center;
            padding: 50px 20px;
        }

        .error-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .error-text {
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .header {
                padding: 15px;
            }

            .teacher-name {
                font-size: 17px;
            }

            .teacher-image {
                width: 48px;
                height: 48px;
            }

            .container {
                padding: 22px 12px 40px;
            }

            .page-title h1 {
                font-size: 23px;
            }

            .profile-header {
                padding: 25px 20px;
            }

            .student-avatar {
                width: 65px;
                height: 65px;
                font-size: 30px;
            }

            .student-header-name {
                font-size: 22px;
            }

            .details {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .sections {
                grid-template-columns: 1fr;
                padding: 0 20px 20px;
            }

        }

        @media (max-width: 450px) {

            .header {
                align-items: flex-start;
            }

            .back-button {
                padding: 9px 12px;
                font-size: 13px;
            }

            .profile-header {
                gap: 14px;
            }

            .student-header-id {
                font-size: 12px;
            }

        }

    </style>
</head>


<body>


    <header class="header">

        <div class="teacher-info">

            <img
                class="teacher-image"
                src="https://i.ibb.co/HfRP5zx8/Whats-App-Image-2026-09-03-at-3-34-26-AM.jpg"
                alt="المدرس"
            >

            <div>

                <div class="teacher-name">
                    مستر مهاب
                </div>

                <div class="brand">
                    NEXORA | Shihab Innovation
                </div>

            </div>

        </div>


        <button
            class="back-button"
            onclick="goBack()"
        >
            ← العودة للطلاب
        </button>

    </header>


    <main class="container">


        <section class="page-title">

            <h1>
                👨‍🎓 ملف الطالب
            </h1>

            <p>
                بيانات الطالب الأساسية
            </p>

        </section>


        <section class="profile-card" id="profileCard">

            <div class="loading">
                ⏳ جاري تحميل بيانات الطالب...
            </div>

        </section>


        <div class="footer">
            NEXORA | Shihab Innovation
        </div>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const supabaseClient = window.supabase.createClient(
            'https://bbiflvdwardvozjvrsya.supabase.co',
            'sb_publishable_I_7nb9Ab0--dz_5hpzq27w_G8_7b6PL'
        );


        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function formatDate(value) {

            if (!value) {
                return 'غير متوفر';
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString('ar-EG', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric'
            });

        }


        function showError(title, text) {

            document.getElementById('profileCard').innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <div class="error-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="error-text">
                        ${escapeHtml(text)}
                    </div>

                </div>

            `;

        }


        async function loadStudent() {

            try {

                const params = new URLSearchParams(
                    window.location.search
                );

                const studentId = params.get('student_id');


                if (!studentId) {

                    showError(
                        'لم يتم تحديد الطالب',
                        'الرابط لا يحتوي على رقم الطالب.'
                    );

                    return;
                }


                const sessionData = localStorage.getItem(
                    'nexora_teacher_session'
                );

                const sessionToken = sessionStorage.getItem(
                    'nexora_teacher_token'
                );


                if (!sessionData || !sessionToken) {

                    window.location.href =
                        'teacher-login.html';

                    return;
                }


                let teacherSession;

                try {

                    teacherSession =
                        JSON.parse(sessionData);

                } catch (error) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;
                }


                if (
                    !teacherSession.expires_at ||
                    new Date(teacherSession.expires_at) <= new Date()
                ) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;
                }


                const { data, error } =
                    await supabaseClient.rpc(
                        'get_teacher_student_by_session',
                        {
                            p_session_token: sessionToken,
                            p_student_id: studentId
                        }
                    );


                if (error) {

                    console.error(
                        'Student RPC error:',
                        error
                    );

                    showError(
                        'حدث خطأ',
                        'تعذر تحميل بيانات الطالب.'
                    );

                    return;
                }


                if (!data || data.length === 0) {

                    showError(
                        'الطالب غير موجود',
                        'لم يتم العثور على هذا الطالب أو انتهت جلسة تسجيل الدخول.'
                    );

                    return;
                }


                const student = data[0];


                document.getElementById(
                    'profileCard'
                ).innerHTML = `

                    <div class="profile-header">

                        <div class="student-avatar">
                            👨‍🎓
                        </div>


                        <div>

                            <div
                                class="student-header-name"
                                id="studentName"
                            >
                                ${escapeHtml(student.name)}
                            </div>


                            <div
                                class="student-header-id"
                                id="studentIdHeader"
                            >
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>

                    </div>


                    <div class="details">


                        <div class="detail-card">

                            <div class="detail-label">
                                👤 اسم الطالب
                            </div>

                            <div
                                class="detail-value"
                                id="nameValue"
                            >
                                ${escapeHtml(student.name)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                🆔 رقم الطالب
                            </div>

                            <div
                                class="detail-value student-id"
                                id="studentIdValue"
                            >
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                📱 رقم الهاتف
                            </div>

                            <div
                                class="detail-value phone"
                                id="phoneValue"
                            >
                                ${escapeHtml(student.phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                👨‍👩‍👦 رقم ولي الأمر
                            </div>

                            <div
                                class="detail-value phone"
                                id="parentPhoneValue"
                            >
                                ${escapeHtml(student.parent_phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                📅 تاريخ التسجيل
                            </div>

                            <div
                                class="detail-value"
                                id="createdValue"
                            >
                                ${formatDate(student.created_at)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                🟢 حالة الطالب
                            </div>

                            <div class="detail-value">

                                <span class="status">
                                    نشط
                                </span>

                            </div>

                        </div>


                    </div>


                    <div class="sections">


                        <div class="section-card">

                            <div class="section-icon">
                                📊
                            </div>

                            <div class="section-title">
                                النتائج
                            </div>

                            <div class="section-text">
                                نتائج الاختبارات والتقييمات
                            </div>

                        </div>


                        <div class="section-card">

                            <div class="section-icon">
                                📚
                            </div>

                            <div class="section-title">
                                الأنشطة
                            </div>

                            <div class="section-text">
                                متابعة نشاط الطالب داخل المنصة
                            </div>

                        </div>


                        <div class="section-card">

                            <div class="section-icon">
                                🏆
                            </div>

                            <div class="section-title">
                                الشهادات
                            </div>

                            <div class="section-text">
                                شهادات الإنجاز والتفوق
                            </div>

                        </div>


                    </div>

                `;

            } catch (error) {

                console.error(
                    'Unexpected error:',
                    error
                );

                showError(
                    'حدث خطأ غير متوقع',
                    'تعذر تحميل ملف الطالب.'
                );

            }

        }


        function goBack() {

            window.location.href =
                'teacher-dashboard.html';

        }


        loadStudent();

    </script>


</body>

</html>
