<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | ملف الطالب</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 18px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .teacher-image {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        .teacher-name {
            font-size: 20px;
            font-weight: 900;
        }

        .brand {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        .back-button {
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;

            padding: 11px 17px;
            border-radius: 12px;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;

            padding: 30px 20px 50px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
            font-size: 15px;
        }

        .profile-card {
            background: white;
            border-radius: 22px;
            overflow: hidden;

            box-shadow:
                0 5px 25px rgba(15, 23, 42, 0.07);
        }

        .profile-header {
            background: #0f172a;
            color: white;

            padding: 30px 25px;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .student-avatar {
            width: 80px;
            height: 80px;

            border-radius: 50%;

            background: #f1f5f9;
            color: #0f172a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            flex-shrink: 0;
        }

        .student-header-name {
            font-size: 27px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .student-header-id {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;

            direction: ltr;
            text-align: right;
        }

        .details {
            padding: 25px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 18px;
        }

        .detail-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;

            padding: 18px;

            background: #f8fafc;
        }

        .detail-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 17px;
            font-weight: 900;

            word-break: break-word;
        }

        .phone {
            direction: ltr;
            text-align: right;
        }

        .student-id {
            direction: ltr;
            text-align: right;

            font-family: monospace;
        }

        .status {
            display: inline-block;

            background: #dcfce7;
            color: #166534;

            padding: 7px 12px;
            border-radius: 20px;

            font-size: 13px;
            font-weight: 900;
        }

        /* =========================
           الأقسام
        ========================= */

        .sections {
            padding: 0 25px 25px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 15px;
        }

        .section-card {
            border: 1px solid #e2e8f0;
            border-radius: 17px;

            padding: 20px;

            background: white;

            text-align: center;

            cursor: pointer;
            transition: 0.2s;
        }

        .section-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .section-card.active {
            border-color: #0f172a;
            background: #f8fafc;
        }

        .section-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .section-text {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        /* =========================
           النتائج
        ========================= */

        .results-container {
            display: none;
            padding: 0 25px 25px;
        }

        .results-container.show {
            display: block;
        }

        .results-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .results-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 16px;
            text-align: center;
        }

        .summary-label {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .summary-value {
            font-size: 21px;
            font-weight: 900;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            background: #f8fafc;
        }

        .result-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 14px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.6;
        }

        .result-percentage {
            font-size: 20px;
            font-weight: 900;
            white-space: nowrap;
        }

        .result-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .result-info-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px;
        }

        .result-info-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .result-info-value {
            font-size: 14px;
            font-weight: 900;
        }

        .empty-results {
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
            font-size: 14px;
            font-weight: 800;
        }

        .results-loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-weight: 800;
        }

        /* =========================
           التقييمات
        ========================= */

        .evaluations-container {
            display: none;
            padding: 0 25px 25px;
        }

        .evaluations-container.show {
            display: block;
        }

        .evaluations-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .evaluations-title {
            font-size: 21px;
            font-weight: 900;
        }

        .add-evaluation-button {
            border: none;
            background: #0f172a;
            color: white;
            padding: 10px 14px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }

        .add-evaluation-button:hover {
            opacity: 0.9;
        }

        .evaluations-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .evaluation-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            background: #f8fafc;
        }

        .evaluation-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
        }

        .evaluation-card-title {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.6;
        }

        .evaluation-date {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .evaluation-text {
            color: #475569;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.8;
            white-space: pre-wrap;
            margin-bottom: 12px;
        }

        .evaluation-score {
            display: inline-block;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 900;
        }

        .empty-evaluations {
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
            font-size: 14px;
            font-weight: 800;
        }

        .evaluations-loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-weight: 800;
        }

        .evaluation-form {
            display: none;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            background: white;
            margin-bottom: 15px;
        }

        .evaluation-form.show {
            display: block;
        }

        .evaluation-form-title {
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 900;
            color: #475569;
            margin-bottom: 7px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: #f8fafc;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #0f172a;
            background: white;
        }

        .form-textarea {
            min-height: 110px;
            resize: vertical;
        }

        .score-fields {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .save-evaluation-button,
        .cancel-evaluation-button {
            border: none;
            padding: 11px 15px;
            border-radius: 11px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
        }

        .save-evaluation-button {
            background: #0f172a;
            color: white;
        }

        .cancel-evaluation-button {
            background: #e2e8f0;
            color: #0f172a;
        }

        .evaluation-message {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.6;
        }

        /* =========================
           الأنشطة
        ========================= */

        .activities-container {
            display: none;
            padding: 0 25px 25px;
        }

        .activities-container.show {
            display: block;
        }

        .activities-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .activities-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .activity-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            background: #f8fafc;
        }

        .activity-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
        }

        .activity-type {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.6;
        }

        .activity-date {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .activity-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .activity-info-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px;
        }

        .activity-info-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .activity-info-value {
            font-size: 14px;
            font-weight: 900;
            line-height: 1.6;
            word-break: break-word;
        }

        .activity-details {
            margin-top: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
        }

        .activity-details-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .activity-details-value {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .activities-loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-weight: 800;
        }

        .empty-activities {
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
            font-size: 14px;
            font-weight: 800;
        }

        /* =========================
           الشهادات
        ========================= */

        .certificates-container {
            display: none;
            padding: 0 25px 25px;
        }

        .certificates-container.show {
            display: block;
        }

        .certificates-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .certificates-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .certificate-card {
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 20px;
            background: #f8fafc;
        }

        .certificate-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .certificate-teacher-image {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e2e8f0;
            background: white;
        }

        .certificate-teacher-name {
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .certificate-label {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
        }

        .certificate-main {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .certificate-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .certificate-name {
            font-size: 19px;
            font-weight: 900;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .certificate-score {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .certificate-message {
            color: #475569;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .certificate-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: right;
        }

        .certificate-info-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px;
        }

        .certificate-info-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .certificate-info-value {
            font-size: 13px;
            font-weight: 900;
            word-break: break-word;
        }

        .certificate-id {
            direction: ltr;
            text-align: right;
            font-family: monospace;
        }

        .certificates-loading {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-weight: 800;
        }

        .empty-certificates {
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            color: #64748b;
            background: #f8fafc;
            font-size: 14px;
            font-weight: 800;
        }

        .footer {
            text-align: center;

            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;

            padding: 30px 0 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            font-weight: 800;
            color: #64748b;
        }

        .error {

            padding: 50px 20px;
        }

        .error-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .error-text {
            color: #64748b;

        }

        @media (max-width: 800px) {

            }

            .teacher-image {

                height: 48px;
            }

            .container {
                padding: 22px 12px 40px;
            }

            .page-title h1 {

            }

            .profile-header {

            }

            .student-avatar {

                height: 65px;
                font-size: 30px;
            }

            .student-header-name {

            }

                grid-template-columns: 1fr;
                padding: 20px;
            }

            .sections {
                grid-template-columns: 1fr;
                padding: 0 20px 20px;
            }

            .results-container,
            .evaluations-container,
            .activities-container,

                padding: 0 20px 20px;
            }

            .results-summary {
                grid-template-columns: 1fr;
            }

            .result-info {
                grid-template-columns: 1fr;
            }

            .activity-info {
                grid-template-columns: 1fr;
            }

            .certificate-info {
                grid-template-columns: 1fr;
            }

            .evaluations-header {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        @media (max-width: 450px) {

            .header {
                align-items: flex-start;
            }

            .back-button {
                padding: 9px 12px;
                font-size: 13px;
            }

            .profile-header {
                gap: 14px;
            }

            .student-header-id {
                font-size: 12px;
            }

            .result-top {
                flex-direction: column;
            }

            .evaluation-top {
                flex-direction: column;
            }

            .activity-top {
                flex-direction: column;
            }

            .score-fields {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

        }

    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const supabaseClient = window.supabase.createClient(
            'https://bbiflvdwardvozjvrsya.supabase.co',
            'sb_publishable_I_7nb9Ab0--dz_5hpzq27w_G8_7b6PL'
        );


        let currentStudentId = null;
        let currentSessionToken = null;


        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function formatDate(value) {

            if (!value) {
                return 'غير متوفر';
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString('ar-EG', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric'
            });

        }


        function formatDateTime(value) {

            if (!value) {
                return 'غير متوفر';
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString('ar-EG', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });

        }


        function showError(title, text) {

            document.getElementById('profileCard').innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <div class="error-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="error-text">
                        ${escapeHtml(text)}
                    </div>

                </div>

            `;

        async function createEvaluation() {

            if (
                !currentSessionToken ||
                !currentStudentId
            ) {

                return;

            }


            const titleInput =
                document.getElementById('evaluationTitle');

            const textInput =
                document.getElementById('evaluationText');

            const scoreInput =
                document.getElementById('evaluationScore');

            const maxScoreInput =
                document.getElementById('evaluationMaxScore');

            const saveButton =
                document.getElementById('saveEvaluationButton');

            const message =
                document.getElementById('evaluationMessage');


            if (
                !titleInput ||
                !textInput ||
                !scoreInput ||
                !maxScoreInput ||
                !saveButton ||
                !message
            ) {

                return;

            }


            const title =
                titleInput.value.trim();

            const evaluation =
                textInput.value.trim();


            const scoreValue =
                scoreInput.value.trim();

            const maxScoreValue =
                maxScoreInput.value.trim();


            if (!title) {

                message.textContent =
                    'اكتب عنوان التقييم أولًا.';

                return;

            }


            if (!evaluation) {

                message.textContent =
                    'اكتب ملاحظات التقييم أولًا.';

                return;

            }


            let score =
                scoreValue === ''
                    ? null
                    : Number(scoreValue);


            let maxScore =
                maxScoreValue === ''
                    ? null
                    : Number(maxScoreValue);


            if (
                score !== null &&
                (!Number.isFinite(score) || score < 0)
            ) {

                message.textContent =
                    'الدرجة غير صحيحة.';

                return;

            }


            if (
                maxScore !== null &&
                (!Number.isFinite(maxScore) || maxScore <= 0)
            ) {

                message.textContent =
                    'الدرجة القصوى غير صحيحة.';

                return;

            }


            if (
                score !== null &&
                maxScore !== null &&
                score > maxScore
            ) {

                message.textContent =
                    'الدرجة لا يمكن أن تكون أكبر من الدرجة القصوى.';

                return;

            }


            saveButton.disabled = true;
            saveButton.textContent = 'جاري الحفظ...';

            message.textContent = '';


            const { data, error } =
                await supabaseClient.rpc(
                    'create_teacher_evaluation_by_session',
                    {
                        p_session_token: currentSessionToken,
                        p_student_id: currentStudentId,
                        p_title: title,
                        p_evaluation: evaluation,
                        p_score: score,
                        p_max_score: maxScore
                    }
                );


            if (error) {

                console.error(
                    'Create evaluation RPC error:',
                    error
                );

                message.textContent =
                    'تعذر حفظ التقييم حاليًا.';

                saveButton.disabled = false;
                saveButton.textContent = 'حفظ التقييم';

                return;

            }


            if (!data || data.length === 0) {

                message.textContent =
                    'تعذر حفظ التقييم. قد تكون جلسة المدرس منتهية.';

                saveButton.disabled = false;
                saveButton.textContent = 'حفظ التقييم';

                return;

            }


            await loadStudentEvaluations(
                currentSessionToken,
                currentStudentId
            );

        }

                try {

                    teacherSession =
                        JSON.parse(sessionData);

                } catch (error) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;

                }


                if (
                    !teacherSession.expires_at ||
                    new Date(
                        teacherSession.expires_at
                    ) <= new Date()
                ) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;

                }


                const { data, error } =
                    await supabaseClient.rpc(
                        'get_teacher_student_by_session',
                        {
                            p_session_token: sessionToken,
                            p_student_id: studentId
                        }
                    );


                if (error) {

                    console.error(
                        'Student RPC error:',
                        error
                    );

                    showError(
                        'حدث خطأ',
                        'تعذر تحميل بيانات الطالب.'
                    );

                    return;

                }


                if (!data || data.length === 0) {

                    showError(
                        'الطالب غير موجود',
                        'لم يتم العثور على هذا الطالب أو انتهت جلسة تسجيل الدخول.'
                    );

                    return;

                }


                const student =
                    data[0];


                currentStudentId =
                    student.student_id;

                currentSessionToken =
                    sessionToken;


                document.getElementById(
                    'profileCard'
                ).innerHTML = `

                    <div class="profile-header">

                        <div class="student-avatar">
                            👨‍🎓
                        </div>


                        <div>

                            <div class="student-header-name">
                                ${escapeHtml(student.name)}
                            </div>


                            <div class="student-header-id">
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>

                    </div>


                    <div class="details">


                        <div class="detail-card">

                            <div class="detail-label">
                                👤 اسم الطالب
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(student.name)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                🆔 رقم الطالب
                            </div>

                            <div class="detail-value student-id">
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                📱 رقم الهاتف
                            </div>

                            <div class="detail-value phone">
                                ${escapeHtml(student.phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                👨‍👩‍👦 رقم ولي الأمر
                            </div>

                            <div class="detail-value phone">
                                ${escapeHtml(student.parent_phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                📅 تاريخ التسجيل
                            </div>

                            <div class="detail-value">
                                ${formatDate(student.created_at)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                🟢 حالة الطالب
                            </div>

                            <div class="detail-value">

                                <span class="status">
                                    نشط
                                </span>

                            </div>

                        </div>


                    </div>


                    <div class="sections">


                        <div
                            class="section-card"
                            id="resultsButton"
                            onclick="toggleResults()"
                        >

                            <div class="section-icon">
                                📊
                            </div>

                            <div class="section-title">
                                النتائج
                            </div>

                            <div class="section-text">
                                اضغط لعرض نتائج الاختبارات
                            </div>

                        </div>


                        <div
                            class="section-card"
                            id="evaluationsButton"
                            onclick="toggleEvaluations()"
                        >

                            <div class="section-icon">
                                📝
                            </div>

                            <div class="section-title">
                                التقييمات
                            </div>

                            <div class="section-text">
                                تقييمات وملاحظات المدرس على مستوى الطالب
                            </div>

                        </div>


                        <div
                            class="section-card"
                            id="activitiesButton"
                            onclick="toggleActivities()"
                        >

                            <div class="section-icon">
                                📚
                            </div>

                            <div class="section-title">
                                الأنشطة
                            </div>

                            <div class="section-text">
                                متابعة نشاط الطالب داخل المنصة
                            </div>

                        </div>


                        <div
                            class="section-card"
                            id="certificatesButton"
                            onclick="toggleCertificates()"
                        >

                            <div class="section-icon">
                                🏆
                            </div>

                            <div class="section-title">
                                الشهادات
                            </div>

                            <div class="section-text">
                                شهادات الإنجاز والتفوق
                            </div>

                        </div>


                    </div>


                    <div
                        class="results-container"
                        id="resultsContainer"
                    >
                    </div>


                    <div
                        class="evaluations-container"
                        id="evaluationsContainer"
                    >
                    </div>


                    <div
                        class="activities-container"
                        id="activitiesContainer"
                    >
                    </div>


                    <div
                        class="certificates-container"
                        id="certificatesContainer"
                    >
                    </div>

                `;


                /*
                 * نجهز الأقسام الأربعة من البداية،
                 * لكنها تظل مخفية حتى يضغط المدرس عليها.
                 */

                await loadStudentResults(
                    sessionToken,
                    student.student_id
                );


                await loadStudentEvaluations(
                    sessionToken,
                    student.student_id
                );


                await loadStudentActivities(
                    sessionToken,
                    student.student_id
                );


                await loadStudentCertificates(
                    sessionToken,
                    student.student_id
                );


            } catch (error) {

                console.error(
                    'Unexpected error:',
                    error
                );

                showError(
                    'حدث خطأ غير متوقع',
                    'تعذر تحميل ملف الطالب.'
                );

            }

        }


        function goBack() {

            window.location.href =
                'teacher-dashboard.html';

        }


        loadStudent();

    </script>


</body>

</html>
