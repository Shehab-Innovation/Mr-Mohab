<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | ملف الطالب</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        /* Pre-paint theme sync with the Student Site (same storage key
           and same effective-theme rules as ui-enhance.js — read-only,
           the switcher below lives in this page only). */
        (function () {
            var preference = 'dark';
            try {
                var stored = localStorage.getItem('themePreference');
                if (stored === 'light' || stored === 'dark' || stored === 'system') {
                    preference = stored;
                }
            } catch (error) { /* default stays dark */ }
            var effective =
                preference === 'system'
                    ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
                    : preference;
            document.documentElement.setAttribute('data-theme', effective);
        })();
    </script>

    <style>
        /* ============================================================
           NEXORA shared identity — copied from teacher-dashboard.html
           (source of truth). Presentation layer ONLY: every class,
           id and function of the student profile stays untouched.
           Light is the :root default; dark = html[data-theme="dark"];
           System follows themePreference (same key as Student UI).
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font-ar: 'Cairo', 'Segoe UI', Tahoma, sans-serif;

            --primary: #C9A227;
            --primary-strong: #A8841C;
            --primary-soft: rgba(201, 162, 39, .12);
            --primary-ring: rgba(201, 162, 39, .28);

            --bg: #F4F1EA;
            --surface: #FFFFFF;
            --surface-2: #FAF8F3;
            --surface-3: #F1EDE3;
            --border: #DBD3C3;
            --border-strong: #C9BFAC;

            --text: #1C1A16;
            --text-2: #44403A;
            --muted: #5D5750;
            --faint: #6E675C;

            --success: #157A50;
            --success-soft: rgba(21, 122, 80, .10);
            --warning: #A8841C;
            --warning-soft: rgba(168, 132, 28, .12);
            --error: #C03A3A;
            --error-soft: rgba(192, 58, 58, .10);

            --shadow-sm: 0 2px 4px rgba(60, 50, 20, .05), 0 8px 22px rgba(60, 50, 20, .07);
            --shadow-md: 0 4px 10px rgba(60, 50, 20, .06), 0 18px 40px rgba(60, 50, 20, .10);
            --shadow-primary: 0 6px 20px rgba(168, 132, 28, .25);

            --ease-out: cubic-bezier(.22, .61, .36, 1);
            --dur-fast: 150ms;
            --dur: 240ms;

            color-scheme: light;
        }

        html[data-theme="dark"] {
            color-scheme: dark;

            --primary: #C9A227;
            --primary-strong: #A8841C;
            --primary-soft: rgba(201, 162, 39, .12);
            --primary-ring: rgba(201, 162, 39, .28);

            --bg: #0A0A0C;
            --surface: #141417;
            --surface-2: #1A1A1F;
            --surface-3: #222228;
            --border: #2A2A31;
            --border-strong: #3A3A44;

            --text: #F5F1E6;
            --text-2: #D8D2C2;
            --muted: #A09A8C;
            --faint: #7A7468;

            --success: #3ECF8E;
            --success-soft: rgba(62, 207, 142, .12);
            --warning: #E3B84B;
            --warning-soft: rgba(227, 184, 75, .12);
            --error: #F06060;
            --error-soft: rgba(240, 96, 96, .12);

            --shadow-sm: 0 2px 4px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .35);
            --shadow-md: 0 4px 10px rgba(0, 0, 0, .4), 0 20px 44px rgba(0, 0, 0, .45);
            --shadow-primary: 0 6px 22px rgba(201, 162, 39, .30);
        }

        body {
            font-family: var(--font-ar);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Header (same dark band + gold identity as dashboard) ---------- */
        .header {
            background: linear-gradient(180deg, #211D18 0%, #282219 60%, #2E2820 100%);
            color: #F5F1E6;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.18);
            border-bottom: 1px solid rgba(201, 162, 39, .25);
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .teacher-image {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(201, 162, 39, 0.55);
        }

        .teacher-name {
            font-size: 20px;
            font-weight: 900;
        }

        .brand {
            font-size: 14px;
            color: #C9A227;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-switch {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(201, 162, 39, .3);
            border-radius: 999px;
            padding: 4px;
        }

        .ts-btn {
            border: none;
            background: transparent;
            color: rgba(245, 241, 230, .75);
            font-family: var(--font-ar);
            font-size: 12.5px;
            font-weight: 800;
            padding: 7px 12px;
            border-radius: 999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
        }

        .ts-btn:hover {
            color: #F5F1E6;
        }

        .ts-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .ts-btn:focus-visible,
        .back-button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .back-button {
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            padding: 11px 17px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            font-family: var(--font-ar);
            cursor: pointer;
            transition: 0.2s;
        }

        .back-button:hover {
            background: rgba(201, 162, 39, 0.25);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px 50px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .page-title p {
            color: var(--muted);
            font-size: 15px;
        }

        /* ---------- Profile card + info grid (dashboard cards) ---------- */
        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .student-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 24px 22px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .student-avatar {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: var(--shadow-primary);
        }

        .student-header-name {
            font-size: 20px;
            font-weight: 900;
        }

        .student-header-id {
            color: var(--muted);
            font-family: monospace;
            font-size: 12.5px;
            direction: ltr;
            text-align: right;
            margin-top: 4px;
        }

        .details {
            padding: 20px 22px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .detail-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            background: var(--surface-2);
            transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        .detail-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .detail-label {
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .detail-label i {
            color: var(--primary);
            font-size: 12px;
        }

        .detail-value {
            font-weight: 800;
            font-size: 14.5px;
            direction: ltr;
            text-align: right;
        }

        .detail-value.rtl {
            direction: rtl;
        }

        .status {
            display: inline-block;
            background: var(--success-soft);
            color: var(--success);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 900;
        }

        /* ---------- Section launcher (dashboard mini-cards) ---------- */
        .sections {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 20px 22px;
        }

        .section-card {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            padding: 16px;
            cursor: pointer;
            font-family: var(--font-ar);
            transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        .section-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .section-card.active {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .section-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--primary-soft);
            border: 1px solid var(--border-strong);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .section-text {
            font-size: 14.5px;
            font-weight: 800;
        }

        /* ---------- Section blocks ---------- */
        .results-container,
        .evaluations-container,
        .activities-container,
        .certificates-container {
            display: none;
            padding: 20px 22px 24px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .results-container.show,
        .evaluations-container.show,
        .activities-container.show,
        .certificates-container.show {
            display: block;
            animation: pageIn var(--dur) var(--ease-out);
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        .results-title,
        .evaluations-title,
        .activities-title,
        .certificates-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 16px;
        }

        .results-title i,
        .evaluations-title i,
        .activities-title i,
        .certificates-title i {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--primary-soft);
            border: 1px solid var(--border-strong);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .results-header,
        .evaluations-header,
        .activities-header,
        .certificates-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        .results-list,
        .evaluations-list,
        .activities-list,
        .certificates-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
        }

        .results-loading,
        .evaluations-loading,
        .activities-loading,
        .certificates-loading {
            color: var(--muted);
            font-weight: 700;
            padding: 18px 0 4px;
        }

        /* ---------- Result / evaluation / activity cards ---------- */
        .result-card,
        .evaluation-card,
        .activity-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            padding: 18px;
            transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        .result-card:hover,
        .evaluation-card:hover,
        .activity-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .result-top,
        .evaluation-top,
        .activity-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .result-title,
        .evaluation-card-title,
        .activity-type {
            font-size: 15.5px;
            font-weight: 900;
        }

        .result-percentage {
            display: inline-block;
            min-width: 52px;
            text-align: center;
            background: var(--success-soft);
            color: var(--success);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 900;
        }

        .result-percentage.warn,
        .evaluation-score.warn {
            background: var(--warning-soft);
            color: var(--warning);
        }

        .result-info,
        .activity-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-info-item,
        .activity-info-item {
            background: var(--surface-3);
            color: var(--text-2);
            padding: 6px 9px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
        }

        .result-info-label,
        .activity-info-label {
            color: var(--muted);
            font-weight: 700;
        }

        .evaluation-score {
            display: inline-block;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 900;
        }

        .evaluation-text {
            color: var(--text-2);
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .evaluation-date,
        .activity-date {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .activity-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
        }

        .activity-details-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
        }

        .activity-details-label {
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 700;
        }

        .activity-details-value {
            font-size: 12.5px;
            font-weight: 800;
            direction: ltr;
        }

        /* ---------- Certificate cards ---------- */
        .certificate-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            padding: 18px;
            transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        .certificate-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .certificate-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
        }

        .certificate-icon {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: var(--shadow-primary);
        }

        .certificate-main {
            flex: 1;
            min-width: 200px;
        }

        .certificate-name {
            font-size: 15.5px;
            font-weight: 900;
        }

        .certificate-id {
            color: var(--muted);
            font-family: monospace;
            font-size: 11.5px;
            direction: ltr;
            text-align: right;
            margin-top: 4px;
        }

        .certificate-message {
            color: var(--text-2);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.8;
            margin-top: 8px;
        }

        .certificate-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .certificate-info-item {
            background: var(--surface-3);
            color: var(--text-2);
            padding: 6px 9px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
        }

        .certificate-info-label {
            color: var(--muted);
            font-weight: 700;
        }

        .certificate-teacher-image {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 162, 39, 0.55);
        }

        .certificate-teacher-name {
            font-size: 12.5px;
            font-weight: 800;
        }

        /* ---------- Empty / loading / error ---------- */
        .empty-results,
        .empty-evaluations,
        .empty-activities,
        .empty-certificates {
            text-align: center;
            padding: 34px 20px;
            color: var(--muted);
            border: 1px dashed var(--border-strong);
            border-radius: 16px;
            background: var(--surface-2);
        }

        .empty-results i,
        .empty-evaluations i,
        .empty-activities i,
        .empty-certificates i {
            font-size: 30px;
            color: var(--primary);
            opacity: .8;
            display: block;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
            font-weight: 700;
        }

        .error {
            text-align: center;
            padding: 40px 24px;
            color: var(--error);
        }

        .error-icon {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .error-title {
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .error-text {
            color: var(--muted);
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.8;
        }

        /* ---------- Evaluation form (dashboard modal-fields look) ---------- */
        .evaluation-form {
            display: none;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface-2);
            padding: 18px;
            margin-top: 14px;
        }

        .evaluation-form.show {
            display: block;
            animation: pageIn var(--dur) var(--ease-out);
        }

        .evaluation-form-title {
            font-size: 14.5px;
            font-weight: 900;
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 900;
            color: var(--text-2);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border: 1px solid var(--border-strong);
            border-radius: 11px;
            padding: 12px;
            font-size: 14px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-family: var(--font-ar);
        }

        .form-textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .score-fields {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .save-evaluation-button {
            border: none;
            background: var(--primary);
            color: #fff;
            padding: 11px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            font-family: var(--font-ar);
            transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        .save-evaluation-button:hover {
            background: var(--primary-strong);
            transform: translateY(-1px);
            box-shadow: var(--shadow-primary);
        }

        .save-evaluation-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .cancel-evaluation-button {
            border: none;
            background: var(--surface-3);
            color: var(--text);
            padding: 11px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            font-family: var(--font-ar);
        }

        .add-evaluation-button {
            border: none;
            background: var(--primary);
            color: #fff;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 800;
            font-family: var(--font-ar);
            transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
        }

        .add-evaluation-button:hover {
            background: var(--primary-strong);
            transform: translateY(-1px);
            box-shadow: var(--shadow-primary);
        }

        .add-evaluation-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ---------- Certificate delete (same destructive style as dashboard) ---------- */
        .delete-certificate-button {
            border: 1px solid var(--error);
            background: var(--error-soft);
            color: var(--error);

<body>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const supabaseClient = window.supabase.createClient(
            'https://bbiflvdwardvozjvrsya.supabase.co',
            'sb_publishable_I_7nb9Ab0--dz_5hpzq27w_G8_7b6PL'
        );


        let currentStudentId = null;
        let currentSessionToken = null;


        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        function formatDate(value) {

            if (!value) {
                return 'غير متوفر';
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString('ar-EG', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric'
            });

        }


        function formatDateTime(value) {

            if (!value) {
                return 'غير متوفر';
            }

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString('ar-EG', {
                day: 'numeric',
                month: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });

        }


        function showError(title, text) {

            document.getElementById('profileCard').innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        <i class="fas fa-triangle-exclamation"></i>
                    </div>

                    <div class="error-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="error-text">
                        ${escapeHtml(text)}
                    </div>

                </div>

            `;

        }


        /* =========================
           التقييمات
        ========================= */

        function renderEvaluations(evaluations) {

            if (!evaluations || evaluations.length === 0) {

                return `

                    <div class="evaluations-header">

                        <div class="evaluations-title">
                            <i class="fas fa-star-half-stroke"></i> تقييمات الطالب
                        </div>

                        <button
                            class="add-evaluation-button"
                            onclick="toggleEvaluationForm()"
                        >
                            ＋ إضافة تقييم
                        </button>

                    </div>


                    <div
                        class="evaluation-form"
                        id="evaluationForm"
                    >

                        ${renderEvaluationForm()}

                    </div>


                    <div class="empty-evaluations">
                        لا توجد تقييمات مسجلة لهذا الطالب حتى الآن.
                    </div>

                `;

            }


            const evaluationCards =
                evaluations.map(function (evaluation) {

                    let scoreHtml = '';

                    if (
                        evaluation.score !== null &&
                        evaluation.score !== undefined
                    ) {

                        if (
                            evaluation.max_score !== null &&
                            evaluation.max_score !== undefined
                        ) {

                            scoreHtml = `
                                <div class="evaluation-score">
                                    الدرجة:
                                    ${escapeHtml(evaluation.score)}
                                    /
                                    ${escapeHtml(evaluation.max_score)}
                                </div>
                            `;

                        } else {

                            scoreHtml = `
                                <div class="evaluation-score">
                                    الدرجة:
                                    ${escapeHtml(evaluation.score)}
                                </div>
                            `;

                        }

                    }


                    return `

                        <div class="evaluation-card">

                            <div class="evaluation-top">

                                <div class="evaluation-card-title">
                                    ${escapeHtml(evaluation.title)}
                                </div>

                                <div class="evaluation-date">
                                    ${formatDateTime(
                                        evaluation.created_at
                                    )}
                                </div>

                            </div>


                            <div class="evaluation-text">
                                ${escapeHtml(evaluation.evaluation)}
                            </div>


                            ${scoreHtml}

                        </div>

                    `;

                }).join('');


            return `

                <div class="evaluations-header">

                    <div class="evaluations-title">
                        <i class="fas fa-star-half-stroke"></i> تقييمات الطالب
                    </div>

                    <button
                        class="add-evaluation-button"
                        onclick="toggleEvaluationForm()"
                    >
                        ＋ إضافة تقييم
                    </button>

                </div>


                <div
                    class="evaluation-form"
                    id="evaluationForm"
                >

                    ${renderEvaluationForm()}

                </div>


                <div class="evaluations-list">

                    ${evaluationCards}

                </div>

            `;

        }


        function renderEvaluationForm() {

            return `

                <div class="evaluation-form-title">
                    إضافة تقييم جديد
                </div>


                <div class="form-group">

                    <label class="form-label">
                        عنوان التقييم
                    </label>

                    <input
                        class="form-input"
                        id="evaluationTitle"
                        type="text"
                        placeholder="مثال: تقييم مستوى الطالب"
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        التقييم
                    </label>

                    <textarea
                        class="form-textarea"
                        id="evaluationText"
                        placeholder="اكتب ملاحظاتك وتقييمك للطالب..."
                    ></textarea>

                </div>


                <div class="score-fields">

                    <div class="form-group">

                        <label class="form-label">
                            الدرجة
                        </label>

                        <input
                            class="form-input"
                            id="evaluationScore"
                            type="number"
                            min="0"
                            placeholder="اختياري"
                        >

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            من
                        </label>

                        <input
                            class="form-input"
                            id="evaluationMaxScore"
                            type="number"
                            min="1"
                            placeholder="اختياري"
                        >

                    </div>

                </div>


                <div
                    class="evaluation-message"
                    id="evaluationMessage"
                ></div>


                <div class="form-actions">

                    <button
                        class="save-evaluation-button"
                        id="saveEvaluationButton"
                        onclick="createEvaluation()"
                    >
                        حفظ التقييم
                    </button>


                    <button
                        class="cancel-evaluation-button"
                        onclick="toggleEvaluationForm(false)"
                    >
                        إلغاء
                    </button>

                </div>

            `;

        }


        async function loadStudentEvaluations(
            sessionToken,
            studentId
        ) {

            const evaluationsContainer =
                document.getElementById('evaluationsContainer');


            evaluationsContainer.innerHTML = `

                <div class="evaluations-title">
                    <i class="fas fa-star-half-stroke"></i> تقييمات الطالب
                </div>

                <div class="evaluations-loading">
                    جاري تحميل التقييمات...
                </div>

            `;


            const { data, error } =
                await supabaseClient.rpc(
                    'get_teacher_student_evaluations_by_session',
                    {
                        p_session_token: sessionToken,
                        p_student_id: studentId
                    }
                );


            if (error) {

                console.error(
                    'Evaluations RPC error:',
                    error
                );

                evaluationsContainer.innerHTML = `

                    <div class="evaluations-title">
                        <i class="fas fa-star-half-stroke"></i> تقييمات الطالب
                    </div>

                    <div class="empty-evaluations">
                        تعذر تحميل تقييمات الطالب حاليًا.
                    </div>

                `;

                return;

            }


            evaluationsContainer.innerHTML =
                renderEvaluations(data);

        }


        function toggleEvaluationForm(forceState) {

            const form =
                document.getElementById('evaluationForm');


            if (!form) {
                return;
            }


            if (typeof forceState === 'boolean') {

                form.classList.toggle(
                    'show',
                    forceState
                );

                return;

            }


            form.classList.toggle('show');

        }


        async function createEvaluation() {

            if (
                !currentSessionToken ||
                !currentStudentId
            ) {

                return;

            }


            const titleInput =
                document.getElementById('evaluationTitle');

            const textInput =
                document.getElementById('evaluationText');

            const scoreInput =
                document.getElementById('evaluationScore');

            const maxScoreInput =
                document.getElementById('evaluationMaxScore');

            const saveButton =
                document.getElementById('saveEvaluationButton');

            const message =
                document.getElementById('evaluationMessage');


            if (
                !titleInput ||
                !textInput ||
                !scoreInput ||
                !maxScoreInput ||
                !saveButton ||
                !message
            ) {

                return;

            }


            const title =
                titleInput.value.trim();

            const evaluation =
                textInput.value.trim();


            const scoreValue =
                scoreInput.value.trim();

            const maxScoreValue =
                maxScoreInput.value.trim();


            if (!title) {

                message.textContent =
                    'اكتب عنوان التقييم أولًا.';

                return;

            }


            if (!evaluation) {

                message.textContent =
                    'اكتب ملاحظات التقييم أولًا.';

                return;

            }


            let score =
                scoreValue === ''
                    ? null
                    : Number(scoreValue);


            let maxScore =
                maxScoreValue === ''
                    ? null
                    : Number(maxScoreValue);


            if (
                score !== null &&
                (!Number.isFinite(score) || score < 0)
            ) {

                message.textContent =
                    'الدرجة غير صحيحة.';

                return;

            }


            if (
                maxScore !== null &&
                (!Number.isFinite(maxScore) || maxScore <= 0)
            ) {

                message.textContent =
                    'الدرجة القصوى غير صحيحة.';

                return;

            }


            if (
                score !== null &&
                maxScore !== null &&
                score > maxScore
            ) {

                message.textContent =
                    'الدرجة لا يمكن أن تكون أكبر من الدرجة القصوى.';

                return;

            }


            saveButton.disabled = true;
            saveButton.textContent = 'جاري الحفظ...';

            message.textContent = '';


            const { data, error } =
                await supabaseClient.rpc(
                    'create_teacher_evaluation_by_session',
                    {
                        p_session_token: currentSessionToken,
                        p_student_id: currentStudentId,
                        p_title: title,
                        p_evaluation: evaluation,
                        p_score: score,
                        p_max_score: maxScore
                    }
                );


            if (error) {

                console.error(
                    'Create evaluation RPC error:',
                    error
                );

                message.textContent =
                    'تعذر حفظ التقييم حاليًا.';

                saveButton.disabled = false;
                saveButton.textContent = 'حفظ التقييم';

                return;

            }


            if (!data || data.length === 0) {

                message.textContent =
                    'تعذر حفظ التقييم. قد تكون جلسة المدرس منتهية.';

                saveButton.disabled = false;
                saveButton.textContent = 'حفظ التقييم';

                return;

            }


            await loadStudentEvaluations(
                currentSessionToken,
                currentStudentId
            );

        }


        function toggleEvaluations() {

            const container =
                document.getElementById('evaluationsContainer');

            const button =
                document.getElementById('evaluationsButton');


            if (container.classList.contains('show')) {

                container.classList.remove('show');
                button.classList.remove('active');

                return;

            }


            container.classList.add('show');
            button.classList.add('active');

        }


        /* =========================
           النتائج
        ========================= */

        function renderResults(results) {

            if (!results || results.length === 0) {

                return `

                    <div class="empty-results">
                        لا توجد نتائج اختبارات مسجلة لهذا الطالب حتى الآن.
                    </div>

                `;

            }


            const totalResults = results.length;


            const averagePercentage =
                Math.round(
                    results.reduce(
                        function (sum, result) {
                            return sum + Number(result.percentage || 0);
                        },
                        0
                    ) / totalResults
                );


            const highestPercentage =
                Math.max.apply(
                    null,
                    results.map(function (result) {
                        return Number(result.percentage || 0);
                    })
                );


            const resultCards = results.map(function (result) {

                return `

                    <div class="result-card">

                        <div class="result-top">

                            <div class="result-title">
                                ${escapeHtml(result.title)}
                            </div>

                            <div class="result-percentage">
                                ${escapeHtml(result.percentage)}%
                            </div>

                        </div>


                        <div class="result-info">

                            <div class="result-info-item">

                                <div class="result-info-label">
                                    الدرجة
                                </div>

                                <div class="result-info-value">
                                    ${escapeHtml(result.correct)}
                                    /
                                    ${escapeHtml(result.total)}
                                </div>

                            </div>


                            <div class="result-info-item">

                                <div class="result-info-label">
                                    الصف
                                </div>

                                <div class="result-info-value">
                                    ${
                                        result.grade !== null &&
                                        result.grade !== undefined
                                            ? escapeHtml(result.grade)
                                            : 'غير محدد'
                                    }
                                </div>

                            </div>


                            <div class="result-info-item">

                                <div class="result-info-label">
                                    التاريخ
                                </div>

                                <div class="result-info-value">
                                    ${formatDate(result.completed_at)}
                                </div>

                            </div>

                        </div>

                    </div>

                `;

            }).join('');


            return `

                <div class="results-title">
                    <i class="fas fa-chart-column"></i> نتائج الطالب
                </div>


                <div class="results-summary">

                    <div class="summary-card">

                        <div class="summary-label">
                            إجمالي الاختبارات
                        </div>

                        <div class="summary-value">
                            ${totalResults}
                        </div>

                    </div>


                    <div class="summary-card">

                        <div class="summary-label">
                            متوسط النتائج
                        </div>

                        <div class="summary-value">
                            ${averagePercentage}%
                        </div>

                    </div>


                    <div class="summary-card">

                        <div class="summary-label">
                            أعلى نتيجة
                        </div>

                        <div class="summary-value">
                            ${highestPercentage}%
                        </div>

                    </div>

                </div>


                <div class="results-list">

                    ${resultCards}

                </div>

            `;

        }


        async function loadStudentResults(
            sessionToken,
            studentId
        ) {

            const resultsContainer =
                document.getElementById('resultsContainer');


            resultsContainer.innerHTML = `

                <div class="results-title">
                    <i class="fas fa-chart-column"></i> نتائج الطالب
                </div>

                <div class="results-loading">
                    جاري تحميل النتائج...
                </div>

            `;


            const { data, error } =
                await supabaseClient.rpc(
                    'get_teacher_student_results_by_session',
                    {
                        p_session_token: sessionToken,
                        p_student_id: studentId
                    }
                );


            if (error) {

                console.error(
                    'Results RPC error:',
                    error
                );

                resultsContainer.innerHTML = `

                    <div class="results-title">
                        <i class="fas fa-chart-column"></i> نتائج الطالب
                    </div>

                    <div class="empty-results">
                        تعذر تحميل نتائج الطالب حاليًا.
                    </div>

                `;

                return;

            }


            resultsContainer.innerHTML =
                renderResults(data);

        }


        function toggleResults() {

            const container =
                document.getElementById('resultsContainer');

            const button =
                document.getElementById('resultsButton');


            if (container.classList.contains('show')) {

                container.classList.remove('show');
                button.classList.remove('active');

                return;

            }


            container.classList.add('show');
            button.classList.add('active');

        }


        /* =========================
           الأنشطة
        ========================= */

        function formatActivityType(type) {

            if (!type) {
                return 'نشاط داخل المنصة';
            }


            const activityMap = {

                'page_view': 'مشاهدة صفحة',

                'view_page': 'مشاهدة صفحة',

                'login': 'تسجيل دخول',

                'logout': 'تسجيل خروج',

                'exam_start': 'بدء اختبار',

                'exam_complete': 'إكمال اختبار',

                'lesson_start': 'بدء درس',

                'lesson_complete': 'إكمال درس',

                'certificate_view': 'مشاهدة شهادة',

                'result_view': 'مشاهدة نتيجة',

                'registration': 'تسجيل الطالب'

            };


            return activityMap[type] || type;

        }


        function formatActivityDetails(details) {

            if (
                details === null ||
                details === undefined ||
                details === ''
            ) {

                return '';

            }


            if (typeof details === 'object') {

                try {

                    return JSON.stringify(
                        details,
                        null,
                        2
                    );

                } catch (error) {

                    return String(details);

                }

            }


            return String(details);

        }


        function renderActivities(activities) {

            if (!activities || activities.length === 0) {

                return `

                    <div class="empty-activities">
                        لا توجد أنشطة مسجلة لهذا الطالب حتى الآن.
                    </div>

                `;

            }


            const activityCards = activities.map(function (activity) {

                const details =
                    formatActivityDetails(activity.details);


                return `

                    <div class="activity-card">

                        <div class="activity-top">

                            <div class="activity-type">
                                ${escapeHtml(
                                    formatActivityType(
                                        activity.activity_type
                                    )
                                )}
                            </div>

                            <div class="activity-date">
                                ${formatDateTime(activity.created_at)}
                            </div>

                        </div>


                        <div class="activity-info">

                            <div class="activity-info-item">

                                <div class="activity-info-label">
                                    الصفحة
                                </div>

                                <div class="activity-info-value">
                                    ${
                                        activity.page

                                    ${escapeHtml(
                                        activity.activity_type ||
                                        'غير محدد'

                                </div>

                        ${

                                    <div class="activity-details">

                                        <div class="activity-details-label">
                                            التفاصيل
                                        </div>

                                        <div class="activity-details-value">

                        }

            return `

                <div class="activities-title">

        async function loadStudentActivities(
            sessionToken,
            studentId
        ) {

            const activitiesContainer =
                document.getElementById('activitiesContainer');


            activitiesContainer.innerHTML = `

                <div class="activities-title">
                    <i class="fas fa-book-open"></i> نشاط الطالب
                </div>

                <div class="activities-loading">
                    جاري تحميل الأنشطة...
                </div>

            `;


            const { data, error } =
                await supabaseClient.rpc(
                    'get_teacher_student_activities_by_session',
                    {
                        p_session_token: sessionToken,
                        p_student_id: studentId
                    }
                );


            if (error) {

                console.error(
                    'Activities RPC error:',
                    error
                );

                activitiesContainer.innerHTML = `

                    <div class="activities-title">
                        <i class="fas fa-book-open"></i> نشاط الطالب
                    </div>

                    <div class="empty-activities">
                        تعذر تحميل أنشطة الطالب حاليًا.
                    </div>

                `;

                return;

        function toggleActivities() {

            const container =
                document.getElementById('activitiesContainer');

            const button =
                document.getElementById('activitiesButton');


            if (container.classList.contains('show')) {

                container.classList.remove('show');
                button.classList.remove('active');

                return;

            }


            container.classList.add('show');
            button.classList.add('active');

        }


        /* =========================
           الشهادات
        ========================= */

        function renderCertificates(certificates) {

                    <div class="empty-certificates">

                    </div>

                `;

            }


            const certificateCards =
                certificates.map(function (certificate) {

                    const teacherImage =
                        certificate.teacher_image ||
                        '';


                    return `

                        <div class="certificate-card">

                            <div class="certificate-header">

                                ${
                                    teacherImage
                                        ? `
                                            <img
                                                class="certificate-teacher-image"
                                                src="${escapeHtml(teacherImage)}"
                                                alt="المدرس"
                                            >
                                        `
                                        : `
                                            <div class="certificate-teacher-image"></div>
                                        `
                                }


                                <div>

                                    <div class="certificate-teacher-name">
                                        ${escapeHtml(
                                            certificate.teacher_name ||
                                            'المدرس'

                                    </div>

                                    <div class="certificate-label">
                                        شهادة إنجاز للطالب
                                    </div>

                                </div>

                                                    certificate.message

                                    <div class="certificate-info-item">

                                        <div class="certificate-info-label">
                                            الطالب
                                        </div>

                                            ${escapeHtml(

                                        </div>

                                    </div>


                                    <div class="certificate-info-item">

                                        <div class="certificate-info-label">
                                            التاريخ
                                        </div>

                                                formatDate(

                                            رقم الشهادة
                                        </div>

                                        <div class="certificate-info-value certificate-id">

                                                certificate.certificate_id

                                        </div>

                                        <div class="certificate-info-value certificate-id">

                                        </div>

                                    </div>


                                </div>

                            </div>


                            <button
                                type="button"
                                class="delete-certificate-button"

        async function loadStudentCertificates(

                    }

                        <i class="fas fa-award"></i> شهادات الطالب

            const container =

                container.classList.remove('show');

            container.classList.add('show');

        /* =========================
           تحميل الطالب
        ========================= */

        async function loadStudent() {

            try {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const studentId =
                    params.get('student_id');


                if (!studentId) {

                    showError(
                        'لم يتم تحديد الطالب',
                        'الرابط لا يحتوي على رقم الطالب.'
                    );

                    return;

                }


                const sessionData =
                    localStorage.getItem(
                        'nexora_teacher_session'
                    );


                const sessionToken =
                    sessionStorage.getItem(
                        'nexora_teacher_token'
                    );


                if (!sessionData || !sessionToken) {

                    window.location.href =
                        'teacher-login.html';

                    return;

                }


                let teacherSession;


                try {

                    teacherSession =
                        JSON.parse(sessionData);

                } catch (error) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;

                }


                if (
                    !teacherSession.expires_at ||
                    new Date(
                        teacherSession.expires_at
                    ) <= new Date()
                ) {

                    localStorage.removeItem(
                        'nexora_teacher_session'
                    );

                    sessionStorage.removeItem(
                        'nexora_teacher_token'
                    );

                    window.location.href =
                        'teacher-login.html';

                    return;

                }


                const { data, error } =
                    await supabaseClient.rpc(
                        'get_teacher_student_by_session',
                        {
                            p_session_token: sessionToken,
                            p_student_id: studentId
                        }
                    );


                if (error) {

                    console.error(
                        'Student RPC error:',
                        error
                    );

                    showError(
                        'حدث خطأ',
                        'تعذر تحميل بيانات الطالب.'
                    );

                    return;

                }


                if (!data || data.length === 0) {

                    showError(
                        'الطالب غير موجود',
                        'لم يتم العثور على هذا الطالب أو انتهت جلسة تسجيل الدخول.'
                    );

                    return;

                }


                const student =
                    data[0];


                currentStudentId =
                    student.student_id;

                currentSessionToken =
                    sessionToken;


                document.getElementById(
                    'profileCard'
                ).innerHTML = `

                    <div class="profile-header">

                        <div class="student-avatar">
                            <i class="fas fa-user-graduate"></i>
                        </div>


                        <div>

                            <div class="student-header-name">
                                ${escapeHtml(student.name)}
                            </div>


                            <div class="student-header-id">
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>

                    </div>


                    <div class="details">


                        <div class="detail-card">

                            <div class="detail-label">
                                <i class="fas fa-user"></i> اسم الطالب
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(student.name)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                <i class="fas fa-id-card"></i> رقم الطالب
                            </div>

                            <div class="detail-value student-id">
                                ${escapeHtml(student.student_id)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                <i class="fas fa-phone"></i> رقم الهاتف
                            </div>

                            <div class="detail-value phone">
                                ${escapeHtml(student.phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                <i class="fas fa-user-group"></i> رقم ولي الأمر
                            </div>

                            <div class="detail-value phone">
                                ${escapeHtml(student.parent_phone)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                <i class="fas fa-calendar-day"></i> تاريخ التسجيل
                            </div>

                            <div class="detail-value">
                                ${formatDate(student.created_at)}
                            </div>

                        </div>


                        <div class="detail-card">

                            <div class="detail-label">
                                <i class="fas fa-circle-check"></i> حالة الطالب
                            </div>

                            <div class="detail-value">

                                <span class="status">
                                    نشط
                                </span>

                            </div>

                        </div>


                    </div>


                    <div class="sections">


                        <div
                            class="section-card"
                            id="resultsButton"
                            onclick="toggleResults()"
                        >

                            <div class="section-icon">
                                <i class="fas fa-chart-column"></i>
                            </div>

                            <div class="section-title">
                                النتائج
                            </div>

                            <div class="section-text">
                                اضغط لعرض نتائج الاختبارات
                            </div>

                        </div>


                        <div
                            class="section-card"
                            id="evaluationsButton"
                            onclick="toggleEvaluations()"
                        >

                            <div class="section-icon">
                                <i class="fas fa-star-half-stroke"></i>
                            </div>

                            <div class="section-title">
                                التقييمات
                            </div>

                            <div class="section-text">
                                تقييمات وملاحظات المدرس على مستوى الطالب
                            </div>

                        </div>


                        <div
                            class="section-card"
                            id="activitiesButton"
                            onclick="toggleActivities()"
                        >

                            <div class="section-icon">
                                <i class="fas fa-book-open"></i>
                            </div>

                            <div class="section-title">
                                الأنشطة
                            </div>

                            <div class="section-text">
                                متابعة نشاط الطالب داخل المنصة
                            </div>

                        </div>


                        <div
                            class="section-card"
                            id="certificatesButton"
                            onclick="toggleCertificates()"
                        >

                            <div class="section-icon">
                                <i class="fas fa-award"></i>
                            </div>

                            <div class="section-title">
                                الشهادات
                            </div>

                            <div class="section-text">
                                شهادات الإنجاز والتفوق
                            </div>

                        </div>


                    </div>


                    <div
                        class="results-container"
                        id="resultsContainer"
                    >
                    </div>


                    <div
                        class="evaluations-container"
                        id="evaluationsContainer"
                    >
                    </div>


                    <div
                        class="activities-container"
                        id="activitiesContainer"
                    >
                    </div>


                    <div
                        class="certificates-container"
                        id="certificatesContainer"
                    >
                    </div>

                `;


                /*
                 * نجهز الأقسام الأربعة من البداية،
                 * لكنها تظل مخفية حتى يضغط المدرس عليها.
                 */

                await loadStudentResults(
                    sessionToken,
                    student.student_id
                );


                await loadStudentEvaluations(
                    sessionToken,
                    student.student_id
                );


                await loadStudentActivities(
                    sessionToken,
                    student.student_id
                );


                await loadStudentCertificates(
                    sessionToken,
                    student.student_id
                );


            } catch (error) {

                console.error(
                    'Unexpected error:',
                    error
                );

                showError(
                    'حدث خطأ غير متوقع',
                    'تعذر تحميل ملف الطالب.'
                );

            }

        }


        function goBack() {

            window.location.href =
                'teacher-dashboard.html#students';

        }


        /* ---------- Certificate delete (teacher-scoped RPC; deletes only this certificate) ---------- */

        async function deleteCertificate(certificateId, studentName) {

            const confirmed =
                confirm(
                    'أنت على وشك حذف شهادة الطالب: ' + (studentName || '') + '\n' +
                    'سيتم حذف الشهادة نهائيًا من قاعدة البيانات.\n\n' +
                    'هل أنت متأكد من الحذف؟'
                );

            if (!confirmed) {
                return;
            }

            if (!currentSessionToken) {
                return;
            }

            try {

                const { data, error } =
                    await supabaseClient.rpc(
                        'delete_teacher_certificate_by_session',
                        {
                            p_session_token: currentSessionToken,
                            p_certificate_id: certificateId
                        }
                    );

                if (error) {

                    console.error(
                        'Delete Certificate RPC error:',
                        error
                    );

                    alert('حدث خطأ أثناء حذف الشهادة.');

                    return;

                }

                const removed =
                    (typeof data === 'number') ? data : 0;

                if (removed === 0) {

                    alert('تعذر حذف الشهادة (غير موجودة ضمن شهادات طلابك).');

                    return;

                }

                if (currentSessionToken && currentStudentId) {

                    loadStudentCertificates(
                        currentSessionToken,
                        currentStudentId
                    );

                }

            } catch (error) {

                console.error(
                    'Unexpected Delete Certificate error:',
                    error
                );

                alert('حدث خطأ غير متوقع أثناء حذف الشهادة.');

            }

        }

        document.addEventListener(
            'click',
            function (event) {

                const button =
                    event.target.closest('[data-del-cert]');

                if (!button) {
                    return;
                }

                deleteCertificate(
                    button.getAttribute('data-del-cert'),
                    button.getAttribute('data-del-cert-name') || ''
                );

            }
        );


        /* =========================
           Theme switch (dashboard behavior)
           Writes the SAME 'themePreference' key owned by the
           Student Site — additive only, no other logic touched.
        ========================= */

        function getStoredTheme() {

            try {

                const value =
                    localStorage.getItem('themePreference');

                return (
                    value === 'light' ||
                    value === 'dark' ||
                    value === 'system'
                )
                    ? value
                    : 'dark';

            } catch (error) {

                return 'dark';

            }

        }


        function systemPrefersDark() {

            return !!(
                window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
            );

        }


        function applyTheme(preference) {

            const effective =
                preference === 'system'
                    ? (systemPrefersDark() ? 'dark' : 'light')
                    : preference;

            document.documentElement.setAttribute(
                'data-theme',
                effective
            );

            document.querySelectorAll('#themeSwitch [data-theme-option]').forEach(function(button) {

                button.classList.toggle(
                    'active',
                    button.getAttribute('data-theme-option') === preference
                );

            });

        }


        document.querySelectorAll('#themeSwitch [data-theme-option]').forEach(function(button) {

            button.addEventListener(
                'click',
                function() {

                    const preference =
                        button.getAttribute('data-theme-option');

                    try {

                        localStorage.setItem('themePreference', preference);

                    } catch (error) {

                        /* storage unavailable — theme still applies this visit */

                    }

                    applyTheme(preference);

                }
            );

        });


        applyTheme(getStoredTheme());

        loadStudent();

    </script>
